[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --no-migrations: the bills migrations are raw Postgres DDL against the pettycashv3
# schema (DO blocks, regclass, gen_random_uuid) and cannot run on the SQLite test DB.
# Without this the whole suite errors at setup with "unknown database pettycashv3".
# Tables are built from the models instead; see SHARED_MODELS_MANAGED_FOR_TESTING.
addopts = -v --tb=short --no-migrations
