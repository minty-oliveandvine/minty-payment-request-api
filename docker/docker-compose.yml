services:
  db:
    image: postgres:15-alpine
    container_name: minty-billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minty_ref}
      POSTGRES_USER: ${POSTGRES_USER:-minty_ref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty_ref_pass}
    ports:
      # Host 5433 -> container 5432 (5432 is taken by the pettycash db locally).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minty_ref_user} -d ${POSTGRES_DB:-minty_ref}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: minty-billing-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      PYTHONUNBUFFERED: "1"
      # MUST match the pettycash backend's SECRET_KEY so JWTs verify on both sides.
      SECRET_KEY: ${SECRET_KEY:-replace-me-shared-with-flask}
      # Database — the app talks to the "db" service over the compose network on
      # 5432; the 5433 host mapping above is only for tools on your laptop.
      POSTGRES_DB: ${POSTGRES_DB:-minty_ref}
      POSTGRES_USER: ${POSTGRES_USER:-minty_ref_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minty_ref_pass}
      DB_HOST: db
      DB_PORT: "5432"
      # S3 / Backblaze
      S3_BUCKET: ${S3_BUCKET:-dummy-bucket}
      S3_KEY: ${S3_KEY:-dummy-key}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET: ${S3_SECRET:-dummy-secret}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      # Cross-module URLs
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3000}
      FLASK_APP_URL: ${FLASK_APP_URL:-http://localhost:5001}
      XERO_TOKEN_SERVICE_URL: ${XERO_TOKEN_SERVICE_URL:-http://localhost:5001/api/internal/xero/token}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      # Host 5002 -> container 5002 (5001 is taken by the pettycash app locally).
      - "5002:5002"
    command:
      - "gunicorn"
      - "-w"
      - "${GUNICORN_WORKERS:-4}"
      - "-b"
      - "0.0.0.0:5002"
      - "config.wsgi:application"

volumes:
  postgres_data:
